name: 本文の誤り
description: 本文の誤り（誤認識・脱字・振り仮名の混入など）を知らせる
title: "[修正案] 弘法大師と景教との関係 一名、物言ふ石、教ふる石（高楠順次郎 訳） "
labels: ["修正案"]
body:
  - type: markdown
    attributes:
      value: 原本の画像は、README の底本のリンクから見られます。わかる範囲で書いてください。
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "行頭にある ID（例: aozora-046428-000001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの本文（直したい所の前後）
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した本文
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
      description: 原本ではどうなっているか、何コマ目か など
